<script>
  let albuminValue = 0;

  function assignAlbuminValue() {
    const ageSelect = document.getElementById('age');
    const selectedText = ageSelect.options[ageSelect.selectedIndex].text; // e.g., "11 years"
    const albumin = parseFloat(document.getElementById('albumin').value);

    if (!selectedText || isNaN(albumin)) {
      document.getElementById('albuminValue').innerText = "Please select age and enter a valid albumin.";
      return;
    }

    // Extract numeric age from the text
    const ageNum = parseInt(selectedText);

    // Thresholds
    if (ageNum === 0) {
      albuminValue = (albumin < 2.2) ? 0.38 : 0;
    } else if (ageNum >= 1 && ageNum <= 15) {
      albuminValue = (albumin < 3.6) ? 0.38 : 0;
    } else if (ageNum >= 16 && ageNum <= 17) {
      albuminValue = (albumin < 3.9) ? 0.38 : 0;
    } else {
      albuminValue = 0; // fallback if out of range
    }

    document.getElementById('albuminValue').innerText =
      `Albumin Submitted`;
  }
</script>


<script>
  let creatinineValue = 0;

  function assignCreatinineValue() {
    const ageSelect = document.getElementById('age');
    const selectedText = ageSelect.options[ageSelect.selectedIndex].text; // e.g. "11 years"
    const ageNum = parseInt(selectedText);
    const sex = document.getElementById('sex').value;
    const creatinine = parseFloat(document.getElementById('creatinine').value);

    if (!selectedText || isNaN(creatinine)) {
      document.getElementById('creatinineValue').innerText = "Please select age, sex, and enter creatinine.";
      return;
    }

    creatinineValue = 0; // default

    // Age 0–1
    if (ageNum >= 0 && ageNum <= 1) {
      if (creatinine > 0.36 && creatinine <= 0.86) creatinineValue = 0.42;
      else if (creatinine > 0.86) creatinineValue = 0.65;
    }
    // Age 2–4
    else if (ageNum >= 2 && ageNum <= 4) {
      if (creatinine > 0.43 && creatinine <= 0.93) creatinineValue = 0.42;
      else if (creatinine > 0.93) creatinineValue = 0.65;
    }
    // Age 5–12
    else if (ageNum >= 5 && ageNum <= 12) {
      if (creatinine > 0.61 && creatinine <= 1.11) creatinineValue = 0.42;
      else if (creatinine > 1.11) creatinineValue = 0.65;
    }
    // Age 13–14
    else if (ageNum >= 13 && ageNum <= 14) {
      if (creatinine > 0.81 && creatinine <= 1.31) creatinineValue = 0.42;
      else if (creatinine > 1.31) creatinineValue = 0.65;
    }
    // Age 15–17
    else if (ageNum >= 15 && ageNum <= 17) {
      if (sex === "Male") {
        if (creatinine > 1.08 && creatinine <= 1.58) creatinineValue = 0.42;
        else if (creatinine > 1.58) creatinineValue = 0.65;
      } else if (sex === "Female") {
        if (creatinine > 0.84 && creatinine <= 1.34) creatinineValue = 0.42;
        else if (creatinine > 1.34) creatinineValue = 0.65;
      }
    }

    document.getElementById('creatinineValue').innerText =
      `Creatinine Submitted`;
  }
</script>
